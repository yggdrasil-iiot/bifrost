<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="6" y="6" width="988" height="588" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="30" y="44" font-size="18" font-weight="600" fill="#c9d1d9">Enterprise readiness: 13 axes, and where each one stands</text>
  <text x="30" y="68" font-size="13" fill="#8b949e">Evidence, boundary and trigger per axis are in the table below.</text>

  <text x="30" y="112" font-size="13" font-weight="700" fill="#3fb950" letter-spacing="1">BUILT · 5</text>
  <text x="30" y="131" font-size="11" fill="#8b949e">the question is answered</text>
  <rect x="30" y="150" width="224" height="70" rx="6" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="44" y="174" font-size="12.5" font-weight="600" fill="#c9d1d9">1 · Multi-site authority</text>
  <text x="44" y="208" font-size="10.5" fill="#8b949e">gates prove a site conforms</text>
  <rect x="30" y="232" width="224" height="70" rx="6" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="44" y="256" font-size="12.5" font-weight="600" fill="#c9d1d9">2 · Governance propagation</text>
  <text x="44" y="290" font-size="10.5" fill="#8b949e">built, with a boundary: next restart</text>
  <rect x="30" y="314" width="224" height="70" rx="6" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="44" y="338" font-size="12.5" font-weight="600" fill="#c9d1d9">3 · Site survives</text>
  <text x="44" y="355" font-size="12.5" font-weight="600" fill="#c9d1d9">disconnection</text>
  <text x="44" y="372" font-size="10.5" fill="#8b949e">serves offline, reconciles later</text>
  <rect x="30" y="396" width="224" height="70" rx="6" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="44" y="420" font-size="12.5" font-weight="600" fill="#c9d1d9">4 · Tamper-evidence</text>
  <text x="44" y="437" font-size="12.5" font-weight="600" fill="#c9d1d9">and rollback</text>
  <text x="44" y="454" font-size="10.5" fill="#8b949e">19 gate legs across LN · I · AN</text>
  <rect x="30" y="478" width="224" height="70" rx="6" fill="#0f2f1a" stroke="#3fb950"/>
  <text x="44" y="502" font-size="12.5" font-weight="600" fill="#c9d1d9">11 · Audit query at scale</text>
  <text x="44" y="536" font-size="10.5" fill="#8b949e">measured: 434 B per entry</text>

  <text x="268" y="112" font-size="13" font-weight="700" fill="#d29922" letter-spacing="1">PARTIAL · 5</text>
  <text x="268" y="131" font-size="11" fill="#8b949e">built in part, gap named</text>
  <rect x="268" y="150" width="224" height="70" rx="6" fill="#1c2128" stroke="#d29922"/>
  <text x="282" y="174" font-size="12.5" font-weight="600" fill="#c9d1d9">5 · Conduit inventory</text>
  <text x="282" y="208" font-size="10.5" fill="#8b949e">frequency and non-TCP missing</text>
  <rect x="268" y="232" width="224" height="70" rx="6" fill="#1c2128" stroke="#d29922"/>
  <text x="282" y="256" font-size="12.5" font-weight="600" fill="#c9d1d9">7 · Supply chain and</text>
  <text x="282" y="273" font-size="12.5" font-weight="600" fill="#c9d1d9">the CRA</text>
  <text x="282" y="290" font-size="10.5" fill="#8b949e">SBOM yes, vuln process no</text>
  <rect x="268" y="314" width="224" height="70" rx="6" fill="#1c2128" stroke="#d29922"/>
  <text x="282" y="338" font-size="12.5" font-weight="600" fill="#c9d1d9">8 · Brownfield vendor</text>
  <text x="282" y="355" font-size="12.5" font-weight="600" fill="#c9d1d9">heterogeneity</text>
  <text x="282" y="372" font-size="10.5" fill="#8b949e">adapters read inbound only</text>

  <rect x="268" y="396" width="224" height="70" rx="6" fill="#1c2128" stroke="#d29922"/>
  <text x="282" y="420" font-size="12.5" font-weight="600" fill="#c9d1d9">12 · Write-path exclusivity</text>
  <text x="282" y="437" font-size="12.5" font-weight="600" fill="#c9d1d9">on OPC-UA</text>
  <text x="282" y="454" font-size="10.5" fill="#8b949e">sim only; Modbus untouched</text>

  <rect x="268" y="478" width="224" height="70" rx="6" fill="#1c2128" stroke="#d29922"/>
  <text x="282" y="502" font-size="12.5" font-weight="600" fill="#c9d1d9">10 · Cert expiry and</text>
  <text x="282" y="519" font-size="12.5" font-weight="600" fill="#c9d1d9">key rotation</text>
  <text x="282" y="536" font-size="10.5" fill="#8b949e">no CA; rotation is not revocation</text>

  <text x="506" y="112" font-size="13" font-weight="700" fill="#8b949e" letter-spacing="1">DEFERRED · 2</text>
  <text x="506" y="131" font-size="11" fill="#8b949e">not built, trigger named</text>
  <rect x="506" y="150" width="224" height="70" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="520" y="174" font-size="12.5" font-weight="600" fill="#c9d1d9">6 · Identity lifecycle</text>
  <text x="520" y="208" font-size="10.5" fill="#8b949e">trigger: a second real site</text>
  <rect x="506" y="232" width="224" height="70" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="520" y="256" font-size="12.5" font-weight="600" fill="#c9d1d9">9 · AAS alignment</text>
  <text x="520" y="290" font-size="10.5" fill="#8b949e">trigger: an IDTA submodel ask</text>

  <text x="744" y="112" font-size="13" font-weight="700" fill="#f85149" letter-spacing="1">OPEN · 1</text>
  <text x="744" y="131" font-size="11" fill="#8b949e">no mechanism at all</text>
  <rect x="744" y="150" width="224" height="70" rx="6" fill="#25171c" stroke="#f85149"/>
  <text x="758" y="174" font-size="12.5" font-weight="600" fill="#c9d1d9">13 · Model vs vendor</text>
  <text x="758" y="191" font-size="12.5" font-weight="600" fill="#c9d1d9">runtime</text>
  <text x="758" y="208" font-size="10.5" fill="#8b949e">no read-back of live config</text>

  <text x="30" y="572" font-size="12.5" fill="#c9d1d9">Five of thirteen are answered and five more in part. Each of the rest names either the gap it leaves or the event that will force it.</text>
</svg>
