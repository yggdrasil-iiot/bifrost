# Tests, plus the five gates that need no broker. The other ten stand up HiveMQ CE and an
# OPC-UA sim themselves; they are deliberately not run here, so a red badge always means a
# real regression rather than a flaky container. Run those locally: scripts/run-*-gate.sh
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: tests + pure-CLI gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the provenance gate reads git history

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build, test, and emit the SBOM
        run: mvn -B -ntp install

      # Java re-encodes System.out through the console charset, so a non-ASCII character in a
      # printed literal becomes "?" on a Windows console. CI runs on Linux and would never see it,
      # which is exactly why the check belongs here rather than in a gate.
      - name: ASCII-only console output
        run: node scripts/check-ascii-output.mjs .

      - name: 'Gate ① schema compatibility (admit + reject)'
        run: bash scripts/run-schema-gate.sh

      - name: 'Gate ② MasterSpec conformance'
        run: bash scripts/run-spec-gate.sh

      - name: 'Gate ③ site ⊨ enterprise + 3-adapter equivalence'
        run: bash scripts/run-template-conformance-gate.sh

      - name: 'Gate ④ deny-by-default command authorization'
        run: bash scripts/run-command-authz-gate.sh

      - name: 'Gate ⑤ git-anchored provenance (verify + tamper)'
        run: bash scripts/run-provenance-gate.sh

      # Broker-free like the five above: the edge's activation bind runs before any network
      # connect, so B6 and B9 reach the real Heimdall main with no broker and no OPC-UA server.
      - name: 'Gate ⑥ break-glass (mint four-eyes, derived marking, edge still binds)'
        run: bash scripts/run-break-glass-gate.sh

      # Broker-free: the vendor's copy arrives as a file, so there is nothing to connect to.
      - name: 'Gate ⑦ vendor model reconciliation (divergence per member, granularity)'
        run: bash scripts/run-model-reconciliation-gate.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-sbom
          path: target/bifrost-sbom.*
          if-no-files-found: error
