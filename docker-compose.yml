# Local bifrost runtime-gate brokers.
#   docker compose up -d hivemq-ce     → site A MQTT on tcp://localhost:1883
#   docker compose up -d hivemq-ce-b   → site B MQTT on tcp://localhost:1884  (multi-site federation gate)
#
# ⚠️ HiveMQ CE 2026.x is secure-by-default: without a security extension it refuses ALL MQTT
#    connections ("No security extension present, MQTT clients can not connect"). For local
#    development we enable the bundled allow-all extension via HIVEMQ_ALLOW_ALL_CLIENTS=true.
services:
  hivemq-ce:
    image: hivemq/hivemq-ce:latest
    container_name: bifrost-hivemq-ce
    ports:
      - "1883:1883"     # MQTT — site A
    environment:
      HIVEMQ_ALLOW_ALL_CLIENTS: "true"
    restart: unless-stopped

  hivemq-ce-b:
    image: hivemq/hivemq-ce:latest
    container_name: bifrost-hivemq-ce-b
    ports:
      - "1884:1883"     # MQTT — site B (container listens on 1883, published to host 1884)
    environment:
      HIVEMQ_ALLOW_ALL_CLIENTS: "true"
    restart: unless-stopped

  # Not started by default. Every existing gate runs `docker compose up -d hivemq-ce` and must keep
  # getting only that, so this service sits behind a profile:
  #   docker compose --profile edge up -d heimdall
  heimdall:
    profiles: ["edge"]
    image: bifrost/heimdall:dev
    build:
      context: .
      dockerfile: heimdall/Dockerfile
    container_name: bifrost-heimdall
    depends_on:
      - hivemq-ce
    environment:
      MQTT_URL: "tcp://hivemq-ce:1883"
      OPCUA_URL: "opc.tcp://host.docker.internal:48400"
      SPB_GROUP: "Bifrost:Line1"
      SPB_EDGE: "recipe-edge"
    # Required for host.docker.internal outside Docker Desktop, harmless on it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./heimdall/registry:/opt/heimdall/registry:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
